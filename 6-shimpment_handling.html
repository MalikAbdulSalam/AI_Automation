<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 Order Fulfillment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header .icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .header .icon i {
            font-size: 28px;
            color: white;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 4px;
        }

        .header p {
            color: #718096;
            font-size: 14px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: #e53e3e;
            margin-left: 2px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            background: #f7fafc;
            color: #2d3748;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #a0aec0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .webhook-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #f7fafc;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            border: 1px solid #e2e8f0;
        }

        .webhook-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .webhook-status .dot.online {
            background: #48bb78;
        }

        .webhook-status .dot.offline {
            background: #fc8181;
        }

        .webhook-status .dot.checking {
            background: #f6ad55;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .webhook-status .status-text {
            color: #4a5568;
            flex: 1;
        }

        .webhook-status .webhook-url {
            color: #a0aec0;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit .spinner {
            display: none;
            animation: spin 0.8s linear infinite;
        }

        .btn-submit.loading .spinner {
            display: inline-block;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .response-box {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .response-box.success {
            display: block;
            background: #f0fff4;
            border: 1px solid #9ae6b4;
        }

        .response-box.error {
            display: block;
            background: #fff5f5;
            border: 1px solid #fc8181;
        }

        .response-box .response-icon {
            margin-right: 10px;
        }

        .response-box.success .response-icon {
            color: #48bb78;
        }

        .response-box.error .response-icon {
            color: #fc8181;
        }

        .response-box .response-title {
            font-weight: 600;
            font-size: 14px;
            color: #2d3748;
        }

        .response-box .response-message {
            font-size: 13px;
            color: #4a5568;
            margin-top: 4px;
            word-break: break-all;
        }

        .response-box .response-details {
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 6px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            color: #4a5568;
            overflow-x: auto;
            max-height: 150px;
            overflow-y: auto;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #a0aec0;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: #edf2f7;
            color: #4a5568;
        }

        .badge.express {
            background: #fef3c7;
            color: #d69e2e;
        }

        /* Responsive */
        @media (max-width: 560px) {
            .container {
                padding: 24px 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="icon">
                <i class="fas fa-box"></i>
            </div>
            <h1>Place Order</h1>
            <p>Send order to fulfillment workflow</p>
        </div>

        <!-- Webhook Status -->
        <div class="webhook-status" id="webhookStatus">
            <span class="dot checking" id="statusDot"></span>
            <span class="status-text" id="statusText">Checking connection...</span>
            <span class="webhook-url" id="webhookUrlDisplay">n8n:5678</span>
        </div>

        <!-- Order Form -->
        <form id="orderForm" autocomplete="off">
            <div class="form-group">
                <label>Order ID <span class="required">*</span></label>
                <input type="text" id="orderId" value="ORD-001" placeholder="e.g. ORD-12345" required>
            </div>

            <div class="form-group">
                <label>Customer Name <span class="required">*</span></label>
                <input type="text" id="customerName" value="John Doe" placeholder="Full name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Total Amount ($) <span class="required">*</span></label>
                    <input type="number" id="totalAmount" value="1250" placeholder="0.00" min="0" step="1" required>
                </div>
                <div class="form-group">
                    <label>Shipping Method</label>
                    <select id="shippingMethod">
                        <option value="standard">🚚 Standard</option>
                        <option value="express">⚡ Express</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Country <span class="required">*</span></label>
                    <select id="country" required>
                        <option value="US">🇺🇸 United States</option>
                        <option value="UK">🇬🇧 United Kingdom</option>
                        <option value="DE">🇩🇪 Germany</option>
                        <option value="FR">🇫🇷 France</option>
                        <option value="JP" selected>🇯🇵 Japan</option>
                        <option value="CN">🇨🇳 China</option>
                        <option value="IN">🇮🇳 India</option>
                        <option value="AU">🇦🇺 Australia</option>
                        <option value="CA">🇨🇦 Canada</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="city" value="Tokyo" placeholder="Enter city">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text"><i class="fas fa-paper-plane"></i> Send Order</span>
                <span class="spinner"><i class="fas fa-circle-notch"></i></span>
            </button>
        </form>

        <!-- Response Box -->
        <div id="responseBox" class="response-box">
            <div style="display: flex; align-items: flex-start;">
                <span class="response-icon"><i class="fas fa-check-circle"></i></span>
                <div style="flex:1;">
                    <div class="response-title" id="responseTitle">Success!</div>
                    <div class="response-message" id="responseMessage">Order sent successfully</div>
                    <div class="response-details" id="responseDetails"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            <span class="badge">🚀 n8n Webhook</span>
            <span style="margin:0 6px;">•</span>
            <span>Order Fulfillment System</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ---------- Configuration ----------
            const N8N_WEBHOOK_URL = 'http://localhost:5678/webhook-test/order';
            const CHECK_INTERVAL = 30000; // Check webhook status every 30s

            // ---------- DOM Elements ----------
            const form = document.getElementById('orderForm');
            const submitBtn = document.getElementById('submitBtn');
            const responseBox = document.getElementById('responseBox');
            const responseTitle = document.getElementById('responseTitle');
            const responseMessage = document.getElementById('responseMessage');
            const responseDetails = document.getElementById('responseDetails');
            
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const webhookUrlDisplay = document.getElementById('webhookUrlDisplay');

            // ---------- Webhook Status Check ----------
            async function checkWebhookStatus() {
                try {
                    // Try to send a lightweight test request
                    const response = await fetch(N8N_WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ test: true }),
                        signal: AbortSignal.timeout(2000)
                    });

                    if (response.status === 405) {
                        statusDot.className = 'dot offline';
                        statusText.textContent = '⚠️ Method not allowed (use POST in n8n)';
                    } else if (response.status === 404) {
                        statusDot.className = 'dot offline';
                        statusText.textContent = '❌ Webhook not found (check URL)';
                    } else {
                        statusDot.className = 'dot online';
                        statusText.textContent = '✅ Connected to n8n';
                    }
                } catch (error) {
                    statusDot.className = 'dot offline';
                    statusText.textContent = '⚠️ n8n not running (start with: n8n start)';
                    console.warn('Webhook status check:', error.message);
                }
            }

            // Check status on load and periodically
            checkWebhookStatus();
            setInterval(checkWebhookStatus, CHECK_INTERVAL);

            // ---------- Form Submission ----------
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                // Get form values
                const orderId = document.getElementById('orderId').value.trim();
                const customerName = document.getElementById('customerName').value.trim();
                const totalAmount = parseFloat(document.getElementById('totalAmount').value);
                const shippingMethod = document.getElementById('shippingMethod').value;
                const country = document.getElementById('country').value;
                const city = document.getElementById('city').value.trim() || 'Unknown';

                // Validate
                if (!orderId || !customerName || !totalAmount || !country) {
                    showResponse('error', 'Missing Fields', 'Please fill in all required fields.');
                    return;
                }

                // Build payload
                const payload = {
                    orderId: orderId,
                    customerName: customerName,
                    totalAmount: totalAmount,
                    shippingAddress: {
                        country: country,
                        city: city
                    },
                    shippingMethod: shippingMethod
                };

                // Show loading state
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;
                responseBox.className = 'response-box';
                responseBox.style.display = 'none';

                try {
                    // Send to n8n webhook
                    const response = await fetch(N8N_WEBHOOK_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    // Parse response
                    let data;
                    try {
                        data = await response.json();
                    } catch {
                        data = { message: response.statusText || 'No response body' };
                    }

                    if (response.ok) {
                        showResponse(
                            'success',
                            '✅ Order Sent Successfully!',
                            `Order ${orderId} has been sent to the fulfillment workflow.`,
                            data
                        );
                        // Reset form (optional)
                        // document.getElementById('orderId').value = 'ORD-' + String(Math.floor(Math.random() * 90000 + 10000));
                    } else {
                        let errorMsg = `Status ${response.status}`;
                        if (data.message) errorMsg += `: ${data.message}`;
                        if (data.error) errorMsg += ` - ${data.error}`;
                        showResponse('error', '❌ Failed to Send Order', errorMsg, data);
                    }

                } catch (error) {
                    console.error('Error:', error);
                    
                    let errorMessage = 'Failed to connect to n8n webhook.';
                    if (error.message.includes('Failed to fetch')) {
                        errorMessage = 'Cannot connect to n8n. Make sure n8n is running (n8n start) and the webhook is configured.';
                    } else if (error.message.includes('405')) {
                        errorMessage = 'Method not allowed. Set n8n webhook to POST method.';
                    } else if (error.message.includes('404')) {
                        errorMessage = 'Webhook not found. Check the URL in n8n.';
                    }
                    
                    showResponse('error', '❌ Connection Error', errorMessage);
                } finally {
                    // Remove loading state
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            });

            // ---------- Response Helper ----------
            function showResponse(type, title, message, data = null) {
                responseBox.className = 'response-box ' + type;
                responseBox.style.display = 'block';
                responseTitle.textContent = title;
                responseMessage.textContent = message;

                if (data) {
                    responseDetails.textContent = JSON.stringify(data, null, 2);
                    responseDetails.style.display = 'block';
                } else {
                    responseDetails.style.display = 'none';
                }

                // Auto-hide after 10 seconds on success
                if (type === 'success') {
                    setTimeout(() => {
                        responseBox.style.opacity = '0.6';
                        setTimeout(() => {
                            responseBox.style.opacity = '1';
                        }, 500);
                    }, 8000);
                }

                // Scroll to response
                responseBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // ---------- Auto-generate Order ID (optional) ----------
            const orderIdInput = document.getElementById('orderId');
            orderIdInput.addEventListener('focus', function() {
                if (this.value === '') {
                    this.value = 'ORD-' + String(Math.floor(Math.random() * 90000 + 10000));
                }
            });

            // ---------- Keyboard shortcut: Ctrl+Enter to submit ----------
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    if (document.activeElement.tagName !== 'BUTTON') {
                        form.dispatchEvent(new Event('submit'));
                    }
                }
            });

            console.log('📦 Order Fulfillment System ready');
            console.log(`🔗 Webhook URL: ${N8N_WEBHOOK_URL}`);
        });
    </script>
</body>
</html>
