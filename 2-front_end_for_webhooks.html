<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digiboost Sales Control Panel</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card */
.container {
    background: #111827;
    padding: 40px;
    border-radius: 16px;
    text-align: center;
    width: 350px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

h1 {
    font-size: 22px;
    margin-bottom: 20px;
    color: #38bdf8;
}

.status {
    margin: 15px 0;
    font-size: 16px;
    color: #94a3b8;
}

/* Button */
button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.start {
    background: #22c55e;
    color: white;
}

.stop {
    background: #ef4444;
    color: white;
}

button:hover {
    opacity: 0.85;
}

.log {
    margin-top: 15px;
    font-size: 14px;
    color: #cbd5e1;
}
</style>
</head>

<body>

<div class="container">
    <h1>Digiboost Sales Panel</h1>

    <div class="status" id="status">
        Status: STOPPED
    </div>

    <button id="toggleBtn" class="start" onclick="toggleService()">
        START SYSTEM
    </button>

    <div class="log" id="log"></div>
</div>

<script>

let isRunning = false;

async function toggleService() {

    const status = document.getElementById("status");
    const btn = document.getElementById("toggleBtn");
    const log = document.getElementById("log");

    const action = isRunning ? "stop" : "start";

    try {

        const response = await fetch(
            "https://injectaisolutions.app.n8n.cloud/webhook/ai_automation_course",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    action: action
                })
            }
        );

        if (response.ok) {

            isRunning = !isRunning;

            if (isRunning) {
                status.innerHTML = "Status: RUNNING";
                btn.innerHTML = "STOP SYSTEM";
                btn.className = "stop";
                log.innerHTML = "System started successfully.";
            } else {
                status.innerHTML = "Status: STOPPED";
                btn.innerHTML = "START SYSTEM";
                btn.className = "start";
                log.innerHTML = "System stopped successfully.";
            }

        } else {
            log.innerHTML = "❌ Server error from n8n";
        }

    } catch (error) {
        console.log(error);
        log.innerHTML = "❌ Connection error (check webhook/CORS)";
    }
}

</script>

</body>
</html>
